name: Release Version

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-version
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Determine version increment
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BUMP: ${{ inputs.bump }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            BUMP="${MANUAL_BUMP}"
          else
            if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
              COMMITS="$(git log -1 --format=%B "${CURRENT_SHA}")"
            else
              COMMITS="$(git log --format=%B "${BEFORE_SHA}..${CURRENT_SHA}")"
            fi

            if grep -Eq '(^|[[:space:]])BREAKING CHANGE:|^[a-z]+(\([^)]*\))?!:' <<< "${COMMITS}"; then
              BUMP="major"
            elif grep -Eq '^feat(\([^)]*\))?:' <<< "${COMMITS}"; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          fi

          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "Selected ${BUMP} version increment."

      - name: Increment version
        id: version
        working-directory: frontend
        shell: bash
        run: |
          npm version "${{ steps.bump.outputs.bump }}" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Synchronize backend version
        run: python scripts/sync_version.py

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify synchronized version
        run: python scripts/sync_version.py --check

      - name: Commit and tag release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json main.py
          git commit -m "chore(release): ${TAG}"
          git tag -a "${TAG}" -m "${TAG}"
          git push --atomic origin "HEAD:${DEFAULT_BRANCH}" "refs/tags/${TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: gh release create "${TAG}" --verify-tag --generate-notes --title "${TAG}" --target "${DEFAULT_BRANCH}"

      - name: Add release summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          echo "## Released ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Version increment: ${{ steps.bump.outputs.bump }}" >> "$GITHUB_STEP_SUMMARY"
          echo "The frontend build passed, versions were synchronized, and the GitHub release was created." >> "$GITHUB_STEP_SUMMARY"
